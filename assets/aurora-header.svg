  <text x="56" y="57" fill="#FFF8E8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HELLO, WORLD</text>
  <text x="38" y="150" fill="#FFF8E8" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="900" letter-spacing="-2">KAVINRAJ</text>
  <text x="38" y="212" fill="#FFF8E8" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="900" letter-spacing="-2">MAYILSAMY</text>
