  <text x="1053" y="57" fill="#FFF8E8" fill-opacity=".7" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" letter-spacing="1.8">BUILDING WITH CURIOSITY</text>
  <circle cx="1101" cy="255" r="48" stroke="url(#aurora)" stroke-width="2" stroke-opacity=".75"/>
  <path d="M1101 224V286M1070 255H1132" stroke="#FFF8E8" stroke-opacity=".75" stroke-width="2"/>
