    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFF8E8" stroke-opacity=".08"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="340" rx="24" fill="#161319"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <ellipse cx="224" cy="30" rx="280" ry="150" fill="url(#pinkGlow)" filter="url(#blur)"/>
  <ellipse cx="1014" cy="300" rx="300" ry="175" fill="url(#violetGlow)" filter="url(#blur)"/>
  <path d="M0 278C160 220 226 334 405 258C598 176 642 280 808 219C965 162 1070 201 1200 114V340H0V278Z" fill="url(#aurora)" fill-opacity=".17"/>
