<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kavinraj Mayilsamy — AI Engineer and Research Intern</title>
  <desc id="desc">A dark editorial banner with pink and violet aurora light.</desc>
  <defs>
    <linearGradient id="aurora" x1="160" y1="-30" x2="1080" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F49A49"/>
      <stop offset=".42" stop-color="#F11976"/>
      <stop offset="1" stop-color="#813CF0"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx="0" cy="0" r="1" gradientTransform="translate(260 60) rotate(40) scale(460 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F11976" stop-opacity=".62"/>
      <stop offset="1" stop-color="#F11976" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(1020 280) rotate(-132) scale(500 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#813CF0" stop-opacity=".58"/>
      <stop offset="1" stop-color="#813CF0" stop-opacity="0"/>
